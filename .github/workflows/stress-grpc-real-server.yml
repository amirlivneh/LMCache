# Temporary experiment, not for merging: repeat the gRPC real-server crash
# test many times on GitHub-hosted runners, idle and under CPU load, to see
# whether test_client_recovers_after_the_server_crashes flakes in CI.
name: Stress gRPC real-server test

on:
  push:
    branches:
      - "claude/stress-grpc-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: "${{ matrix.load }} runner, shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        load: [idle, busy]
        shard: [1, 2, 3]
    env:
      LMCACHE_LOG_LEVEL: CRITICAL
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      # Same install as the upstream "gRPC native server tests" job.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          python -m pip install pygrpc-native==0.7.0 pytest-repeat
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Run the test 50 times
        run: |
          if [ "${{ matrix.load }}" = busy ]; then
            for _ in $(seq "$(nproc)"); do yes > /dev/null & done
          fi
          pytest -q -o addopts="" --count 50 \
            "tests/v1/multiprocess/test_grpc_real_server.py::test_client_recovers_after_the_server_crashes"
